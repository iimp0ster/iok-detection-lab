<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IOK DETECTION LAB</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    /* ------------------------------------------------------------------ */
    /*  Tokens                                                              */
    /* ------------------------------------------------------------------ */
    :root {
      --bg:         #0a0c0f;
      --bg-raised:  #0e1116;
      --bg-panel:   #111419;
      --amber:      #ffb300;
      --amber-dim:  rgba(255,179,0,0.45);
      --amber-glow: rgba(255,179,0,0.18);
      --amber-text: #cc9200;
      --border:     rgba(255,179,0,0.22);
      --border-hi:  rgba(255,179,0,0.60);
      --font:       'IBM Plex Mono', 'Courier New', monospace;
      --sz-xs:      10px;
      --sz-sm:      11px;
      --sz-base:    13px;
      --sz-lg:      15px;
    }

    /* ------------------------------------------------------------------ */
    /*  Reset                                                               */
    /* ------------------------------------------------------------------ */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      border-radius: 0 !important;
      font-family: var(--font);
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--amber-text);
      font-size: var(--sz-base);
      line-height: 1.5;
      overflow: hidden;
    }

    /* ------------------------------------------------------------------ */
    /*  Scanlines overlay                                                   */
    /* ------------------------------------------------------------------ */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(0,0,0,0.07) 2px,
        rgba(0,0,0,0.07) 4px
      );
      pointer-events: none;
      z-index: 9000;
    }

    /* ------------------------------------------------------------------ */
    /*  CRT flicker                                                         */
    /* ------------------------------------------------------------------ */
    @keyframes flicker {
      0%   { opacity: 1;    }
      8%   { opacity: 0.94; }
      16%  { opacity: 1;    }
      26%  { opacity: 0.97; }
      40%  { opacity: 1;    }
      58%  { opacity: 0.96; }
      72%  { opacity: 1;    }
    }
    .flicker { animation: flicker 0.35s linear; }

    /* Amber pulse for status changes */
    @keyframes amber-pulse {
      0%   { box-shadow: 0 0 4px var(--amber-glow); }
      50%  { box-shadow: 0 0 14px var(--amber-dim); }
      100% { box-shadow: 0 0 4px var(--amber-glow); }
    }
    .pulse { animation: amber-pulse 0.6s ease-in-out; }

    /* ------------------------------------------------------------------ */
    /*  Page grid                                                           */
    /* ------------------------------------------------------------------ */
    body {
      display: grid;
      grid-template-rows: 48px 1fr 32px;
      grid-template-columns: 1fr;
    }

    /* ------------------------------------------------------------------ */
    /*  Header                                                              */
    /* ------------------------------------------------------------------ */
    #header {
      grid-row: 1;
      display: flex;
      align-items: center;
      gap: 0;
      background: var(--bg-raised);
      border-bottom: 1px solid var(--border);
      padding: 0 16px;
      white-space: nowrap;
    }

    #header .logo {
      font-size: var(--sz-lg);
      font-weight: 700;
      letter-spacing: 0.15em;
      color: var(--amber);
      text-transform: uppercase;
      margin-right: 24px;
      flex-shrink: 0;
    }

    #header .logo span {
      color: var(--amber-text);
      font-weight: 300;
    }

    /* Vertical rule dividers between header sections */
    .h-sep {
      width: 1px;
      height: 24px;
      background: var(--border);
      margin: 0 16px;
      flex-shrink: 0;
    }

    /* VPN status block */
    #vpn-block {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    #vpn-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      background: #333;
      box-shadow: none;
      flex-shrink: 0;
      transition: background 0.3s, box-shadow 0.3s;
    }
    #vpn-dot.online {
      background: var(--amber);
      box-shadow: 0 0 6px var(--amber);
    }

    #vpn-label {
      font-size: var(--sz-sm);
      color: var(--amber-text);
      letter-spacing: 0.05em;
    }
    #vpn-ip {
      font-size: var(--sz-sm);
      color: var(--amber);
    }

    /* Quick-country chips */
    .country-chips {
      display: flex;
      gap: 4px;
      flex-shrink: 0;
    }
    .chip {
      font-size: var(--sz-xs);
      color: var(--amber-text);
      border: 1px solid var(--border);
      padding: 1px 5px;
      cursor: pointer;
      background: transparent;
      letter-spacing: 0.04em;
      transition: color 0.15s, border-color 0.15s, box-shadow 0.15s;
    }
    .chip:hover {
      color: var(--amber);
      border-color: var(--border-hi);
      box-shadow: 0 0 6px var(--amber-glow);
    }

    /* Rotate button */
    #btn-rotate {
      font-size: var(--sz-base);
      color: var(--amber-text);
      border: 1px solid var(--border);
      background: transparent;
      padding: 2px 8px;
      cursor: pointer;
      letter-spacing: 0.05em;
      transition: color 0.15s, border-color 0.15s, box-shadow 0.15s;
    }
    #btn-rotate:hover {
      color: var(--amber);
      border-color: var(--border-hi);
      box-shadow: 0 0 8px var(--amber-glow);
    }
    #btn-rotate:active { opacity: 0.7; }

    /* Rules count — pushed to far right */
    #rules-count {
      margin-left: auto;
      font-size: var(--sz-sm);
      color: var(--amber-text);
      letter-spacing: 0.06em;
    }
    #rules-count strong {
      color: var(--amber);
      font-weight: 500;
    }

    /* Focus styles for all interactive elements */
    button:focus-visible,
    input:focus-visible,
    select:focus-visible {
      outline: 1px solid var(--amber);
      box-shadow: 0 0 6px var(--amber-glow);
    }

    /* ------------------------------------------------------------------ */
    /*  Main grid (sidebar + content)                                       */
    /* ------------------------------------------------------------------ */
    #main-grid {
      grid-row: 2;
      display: grid;
      grid-template-columns: 280px 1fr;
      overflow: hidden;
    }

    /* ------------------------------------------------------------------ */
    /*  Sidebar                                                             */
    /* ------------------------------------------------------------------ */
    #sidebar {
      border-right: 1px solid var(--border);
      background: var(--bg-raised);
      display: flex;
      flex-direction: column;
      padding: 20px 0;
      overflow-y: auto;
      overflow-x: hidden;
    }

    .sidebar-section-label {
      font-size: var(--sz-xs);
      color: var(--border-hi);
      letter-spacing: 0.18em;
      text-transform: uppercase;
      padding: 0 16px 8px;
      margin-top: 8px;
    }

    .sidebar-item {
      display: flex;
      align-items: center;
      width: 100%;
      padding: 10px 20px;
      background: transparent;
      border: none;
      border-left: 3px solid transparent;
      color: var(--amber-text);
      font-size: var(--sz-base);
      letter-spacing: 0.08em;
      text-align: left;
      cursor: pointer;
      transition: color 0.15s, border-color 0.15s, background 0.15s;
    }
    .sidebar-item::before {
      content: '[ ';
      color: var(--border-hi);
      margin-right: 2px;
    }
    .sidebar-item::after {
      content: ' ]';
      color: var(--border-hi);
      margin-left: 2px;
    }
    .sidebar-item:hover {
      color: var(--amber);
      background: rgba(255,179,0,0.04);
      border-left-color: var(--amber-dim);
    }
    .sidebar-item.active {
      color: var(--amber);
      border-left-color: var(--amber);
      background: rgba(255,179,0,0.06);
      box-shadow: inset 0 0 12px var(--amber-glow);
    }
    .sidebar-item.active::before,
    .sidebar-item.active::after {
      color: var(--amber);
    }

    .sidebar-spacer { flex: 1; }

    .sidebar-meta {
      padding: 12px 16px;
      font-size: var(--sz-xs);
      color: rgba(255,179,0,0.25);
      border-top: 1px solid var(--border);
      letter-spacing: 0.06em;
      line-height: 1.8;
    }

    /* ------------------------------------------------------------------ */
    /*  Main content                                                        */
    /* ------------------------------------------------------------------ */
    #content {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--bg);
    }

    /* Tab strip */
    .tab-strip {
      display: flex;
      align-items: stretch;
      border-bottom: 1px solid var(--border);
      background: var(--bg-raised);
      flex-shrink: 0;
    }

    .tab-btn {
      padding: 0 20px;
      height: 40px;
      background: transparent;
      border: none;
      border-bottom: 2px solid transparent;
      color: var(--amber-text);
      font-size: var(--sz-sm);
      letter-spacing: 0.10em;
      text-transform: uppercase;
      cursor: pointer;
      transition: color 0.15s, border-color 0.15s, box-shadow 0.15s;
      position: relative;
      bottom: -1px; /* overlap the strip bottom border */
    }
    .tab-btn::before { content: '[ '; color: var(--border-hi); }
    .tab-btn::after  { content: ' ]'; color: var(--border-hi); }
    .tab-btn:hover {
      color: var(--amber);
    }
    .tab-btn.active {
      color: var(--amber);
      border-bottom-color: var(--amber);
      box-shadow: 0 4px 10px var(--amber-glow);
    }
    .tab-btn.active::before,
    .tab-btn.active::after {
      color: var(--amber);
    }

    /* Tab panels */
    .tab-panel {
      display: none;
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 24px;
    }
    .tab-panel.active {
      display: flex;
      flex-direction: column;
    }

    /* Placeholder text for empty panels */
    .panel-placeholder {
      margin: auto;
      text-align: center;
      color: rgba(255,179,0,0.18);
      font-size: var(--sz-sm);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      line-height: 2.2;
    }
    .panel-placeholder .big {
      font-size: 11px;
      letter-spacing: 0.25em;
      color: rgba(255,179,0,0.10);
    }

    /* ------------------------------------------------------------------ */
    /*  Status bar                                                          */
    /* ------------------------------------------------------------------ */
    #status-bar {
      grid-row: 3;
      display: flex;
      align-items: center;
      gap: 0;
      padding: 0 16px;
      border-top: 1px solid var(--border);
      background: var(--bg-raised);
      font-size: var(--sz-xs);
      letter-spacing: 0.08em;
      color: var(--amber-text);
      white-space: nowrap;
      overflow: hidden;
    }

    .status-seg {
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .status-seg .lbl {
      color: rgba(255,179,0,0.40);
    }
    .status-seg .val {
      color: var(--amber);
      font-weight: 500;
    }
    .status-pipe {
      color: var(--border);
      margin: 0 12px;
      user-select: none;
    }

    /* ------------------------------------------------------------------ */
    /*  Scrollbar styling                                                   */
    /* ------------------------------------------------------------------ */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb {
      background: rgba(255,179,0,0.20);
      border: none;
    }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255,179,0,0.40); }

    /* ------------------------------------------------------------------ */
    /*  Selection                                                           */
    /* ------------------------------------------------------------------ */
    ::selection {
      background: rgba(255,179,0,0.25);
      color: var(--amber);
    }
  </style>
</head>
<body>

  <!-- ================================================================= -->
  <!--  HEADER                                                             -->
  <!-- ================================================================= -->
  <header id="header">
    <div class="logo">IOK<span> /</span> DETECTION LAB</div>

    <div class="h-sep"></div>

    <div id="vpn-block">
      <span id="vpn-dot" title="VPN status"></span>
      <span id="vpn-label">VPN</span>
      <span id="vpn-ip">——</span>
    </div>

    <div class="h-sep"></div>

    <div class="country-chips" id="country-chips">
      <button class="chip" data-cc="NL" title="Connect NL">NL</button>
      <button class="chip" data-cc="CH" title="Connect CH">CH</button>
      <button class="chip" data-cc="IS" title="Connect IS">IS</button>
      <button class="chip" data-cc="SE" title="Connect SE">SE</button>
      <button class="chip" data-cc="RO" title="Connect RO">RO</button>
    </div>

    <div class="h-sep"></div>

    <button id="btn-rotate" title="Rotate VPN server">&#8635;</button>

    <div id="rules-count">
      <strong id="rules-n">—</strong> RULES
    </div>
  </header>

  <!-- ================================================================= -->
  <!--  MAIN GRID                                                          -->
  <!-- ================================================================= -->
  <div id="main-grid">

    <!-- Sidebar -->
    <nav id="sidebar">
      <div class="sidebar-section-label">Navigation</div>

      <button class="sidebar-item active" id="nav-opsec" data-panel="opsec">
        OPSEC
      </button>
      <button class="sidebar-item" id="nav-hunt" data-panel="hunt">
        HUNT
      </button>
      <button class="sidebar-item" id="nav-rules" data-panel="rules">
        RULES
      </button>

      <div class="sidebar-spacer"></div>

      <div class="sidebar-meta">
        IOK DETECTION LAB<br>
        SOCKS5 :1080<br>
        DB iok.db
      </div>
    </nav>

    <!-- Content -->
    <main id="content">

      <!-- Tab strip -->
      <div class="tab-strip" role="tablist">
        <button class="tab-btn active" data-tab="panel-single" role="tab"
                aria-selected="true" aria-controls="panel-single">
          SINGLE SCAN
        </button>
        <button class="tab-btn" data-tab="panel-batch" role="tab"
                aria-selected="false" aria-controls="panel-batch">
          BATCH SCAN
        </button>
        <button class="tab-btn" data-tab="panel-history" role="tab"
                aria-selected="false" aria-controls="panel-history">
          HISTORY
        </button>
      </div>

      <!-- Tab panels (populated by Branch 05/06) -->
      <div class="tab-panel active" id="panel-single" role="tabpanel">
        <div class="panel-placeholder">
          <div class="big">▒▒▒▒▒▒▒▒▒▒▒▒▒▒▒▒▒▒▒▒</div>
          SINGLE SCAN PANEL<br>
          BRANCH 05
        </div>
      </div>

      <div class="tab-panel" id="panel-batch" role="tabpanel">
        <div class="panel-placeholder">
          <div class="big">▒▒▒▒▒▒▒▒▒▒▒▒▒▒▒▒▒▒▒▒</div>
          BATCH SCAN PANEL<br>
          BRANCH 05
        </div>
      </div>

      <div class="tab-panel" id="panel-history" role="tabpanel">
        <div class="panel-placeholder">
          <div class="big">▒▒▒▒▒▒▒▒▒▒▒▒▒▒▒▒▒▒▒▒</div>
          HISTORY PANEL<br>
          BRANCH 06
        </div>
      </div>

    </main>
  </div>

  <!-- ================================================================= -->
  <!--  STATUS BAR                                                         -->
  <!-- ================================================================= -->
  <div id="status-bar">
    <div class="status-seg">
      <span class="lbl">OP</span>
      <span class="val" id="status-op">IDLE</span>
    </div>
    <span class="status-pipe">|</span>
    <div class="status-seg">
      <span class="lbl">ELAPSED</span>
      <span class="val" id="status-elapsed">00:00</span>
    </div>
    <span class="status-pipe">|</span>
    <div class="status-seg">
      <span class="lbl">EXIT</span>
      <span class="val" id="status-ip">—</span>
    </div>
    <span class="status-pipe">|</span>
    <div class="status-seg">
      <span class="lbl">SCANS TODAY</span>
      <span class="val" id="status-count">0</span>
    </div>
  </div>

  <!-- ================================================================= -->
  <!--  Scripts                                                            -->
  <!-- ================================================================= -->
  <script>
    'use strict';

    /* ---- Utility: CRT flicker on element ---- */
    function flicker(el) {
      el.classList.remove('flicker');
      void el.offsetWidth; // reflow to restart animation
      el.classList.add('flicker');
      el.addEventListener('animationend', () => el.classList.remove('flicker'), { once: true });
    }

    function pulse(el) {
      el.classList.remove('pulse');
      void el.offsetWidth;
      el.classList.add('pulse');
      el.addEventListener('animationend', () => el.classList.remove('pulse'), { once: true });
    }

    /* ---- Tab switching ---- */
    const tabBtns   = document.querySelectorAll('.tab-btn');
    const tabPanels = document.querySelectorAll('.tab-panel');

    tabBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        const targetId = btn.dataset.tab;
        tabBtns.forEach(b => {
          b.classList.remove('active');
          b.setAttribute('aria-selected', 'false');
        });
        tabPanels.forEach(p => p.classList.remove('active'));
        btn.classList.add('active');
        btn.setAttribute('aria-selected', 'true');
        const panel = document.getElementById(targetId);
        if (panel) {
          panel.classList.add('active');
          flicker(panel);
        }
      });
    });

    /* ---- Sidebar nav ---- */
    document.querySelectorAll('.sidebar-item').forEach(item => {
      item.addEventListener('click', () => {
        document.querySelectorAll('.sidebar-item').forEach(i => i.classList.remove('active'));
        item.classList.add('active');
        flicker(item);
      });
    });

    /* ---- Country chip connect (stub — Branch 05 wires real call) ---- */
    document.querySelectorAll('.chip[data-cc]').forEach(chip => {
      chip.addEventListener('click', () => {
        const cc = chip.dataset.cc;
        flicker(chip);
        // POST /api/opsec/connect wired in Branch 05
        console.debug('[opsec] chip connect:', cc);
      });
    });

    /* ---- Rotate button (stub) ---- */
    document.getElementById('btn-rotate').addEventListener('click', () => {
      flicker(document.getElementById('btn-rotate'));
      console.debug('[opsec] rotate triggered');
    });

    /* ---- Poll opsec status every 10s ---- */
    function updateOpsecStatus(data) {
      const dot   = document.getElementById('vpn-dot');
      const ipEl  = document.getElementById('vpn-ip');
      const sipEl = document.getElementById('status-ip');

      const connected = data && data.connected;
      dot.classList.toggle('online',  connected);
      dot.classList.toggle('offline', !connected);
      pulse(dot);

      const ip = (data && data.exit_ip) ? data.exit_ip : '——';
      if (ipEl.textContent !== ip) {
        ipEl.textContent  = ip;
        sipEl.textContent = ip;
        flicker(ipEl);
      }
    }

    function pollOpsecStatus() {
      fetch('/api/opsec/status')
        .then(r => r.ok ? r.json() : null)
        .then(data => { if (data) updateOpsecStatus(data); })
        .catch(() => {});
    }

    /* ---- Load rules count once ---- */
    function loadRulesCount() {
      fetch('/api/rules')
        .then(r => r.ok ? r.json() : null)
        .then(data => {
          if (data && data.count !== undefined) {
            const el = document.getElementById('rules-n');
            el.textContent = data.count;
            flicker(el);
          }
        })
        .catch(() => {});
    }

    /* ---- Bootstrap ---- */
    document.addEventListener('DOMContentLoaded', () => {
      pollOpsecStatus();
      loadRulesCount();
      setInterval(pollOpsecStatus, 10000);
    });
  </script>
</body>
</html>
