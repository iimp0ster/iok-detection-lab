<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IOK Hunt Panel</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="app-header">
    <span class="logo">■ IOK DETECTION LAB</span>
    <nav class="tab-bar">
      <button class="tab active" data-tab="single">Single Scan</button>
      <button class="tab" data-tab="batch">Batch Hunt</button>
      <button class="tab" data-tab="history">History</button>
    </nav>
  </header>

  <!-- ── SINGLE SCAN TAB ─────────────────────────────────────────────── -->
  <section id="tab-single" class="tab-panel active">
    <div class="panel">
      <div class="input-row">
        <input id="url-input" type="url" placeholder="https://suspicious-domain.xyz" spellcheck="false">
        <button id="scan-btn" class="btn btn-primary">▶ SCAN via NL</button>
      </div>

      <div id="scan-status" class="scan-status hidden">
        <span class="spinner">◌</span> Scanning…
      </div>

      <!-- VERDICT -->
      <div id="verdict-panel" class="hidden">
        <div class="section-header">── VERDICT ──</div>
        <div class="verdict-row">
          <span id="verdict-badge" class="verdict-badge"></span>
          <span id="verdict-matches" class="verdict-meta"></span>
          <span id="verdict-exit" class="verdict-meta muted"></span>
          <span id="verdict-time" class="verdict-meta muted"></span>
        </div>

        <div id="rules-list" class="rules-list"></div>

        <!-- SURFACE -->
        <div class="section-header">── SURFACE ──</div>
        <div id="surface-stats" class="surface-stats"></div>

        <!-- FORM ENDPOINTS -->
        <div id="forms-section" class="hidden">
          <div class="section-header">── FORM ENDPOINTS ──</div>
          <div id="forms-list" class="forms-list"></div>
        </div>

        <!-- NETWORK REQUESTS -->
        <div id="requests-section" class="hidden">
          <div class="section-header">── NETWORK REQUESTS ──</div>
          <input id="req-filter" type="text" placeholder="filter…" class="filter-input">
          <div id="requests-list" class="requests-list"></div>
        </div>
      </div>
    </div>
  </section>

  <!-- ── BATCH HUNT TAB ──────────────────────────────────────────────── -->
  <section id="tab-batch" class="tab-panel hidden">
    <div class="panel">
      <div class="batch-controls-top">
        <div class="batch-actions">
          <label class="btn btn-secondary">
            Import .txt <input id="import-file" type="file" accept=".txt" hidden>
          </label>
          <button id="clear-btn" class="btn btn-secondary">Clear</button>
        </div>
      </div>

      <textarea id="url-list" placeholder="https://site1.com&#10;https://site2.net&#10;https://site3.org"></textarea>

      <div class="batch-settings">
        <label>Concurrency
          <select id="concurrency">
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3" selected>3</option>
            <option value="5">5</option>
            <option value="10">10</option>
          </select>
        </label>
        <label>Delay (ms)
          <input id="delay-ms" type="number" value="1500" min="0" step="100" class="num-input">
        </label>
        <label class="toggle-label">VPN
          <input id="vpn-toggle" type="checkbox">
          <span class="toggle-pill"></span>
        </label>
        <div class="rotate-group">
          <span class="rotate-label">Rotate:</span>
          <label><input type="radio" name="rotate" value="none" checked> Off</label>
          <label><input type="radio" name="rotate" value="per_scan"> Per scan</label>
          <label><input type="radio" name="rotate" value="every_n"> Every 5</label>
          <label><input type="radio" name="rotate" value="per_batch"> Per batch</label>
        </div>
      </div>

      <button id="batch-btn" class="btn btn-primary wide">▶ START BATCH HUNT</button>
      <button id="stop-btn" class="btn btn-danger wide hidden">■ STOP</button>

      <!-- PROGRESS -->
      <div id="batch-progress" class="hidden">
        <div class="section-header">── PROGRESS ──</div>
        <div class="progress-row">
          <progress id="batch-bar" value="0" max="100"></progress>
          <span id="batch-counter">0/0</span>
          <span id="batch-high" class="verdict-badge badge-HIGH">HIGH:0</span>
          <span id="batch-med" class="verdict-badge badge-MED">MED:0</span>
          <span id="batch-clean" class="verdict-badge badge-CLEAN">CLEAN:0</span>
        </div>

        <div class="section-header">── LIVE RESULTS (SSE) ──</div>
        <ul id="batch-results" class="batch-results"></ul>

        <div class="export-row">
          <button id="export-json-btn" class="btn btn-secondary">Export JSON</button>
          <button id="export-csv-btn" class="btn btn-secondary">Export CSV</button>
        </div>
      </div>
    </div>
  </section>

  <!-- ── HISTORY TAB ─────────────────────────────────────────────────── -->
  <section id="tab-history" class="tab-panel hidden">
    <div class="panel">
      <div class="history-controls">
        <input id="history-search" type="text" placeholder="Search URL or hostname…" class="filter-input wide">
        <button id="export-history-btn" class="btn btn-secondary">Export JSON</button>
        <button id="refresh-history-btn" class="btn btn-secondary">↺ Refresh</button>
      </div>

      <div class="table-wrap">
        <table id="history-table">
          <thead>
            <tr>
              <th>TIME</th>
              <th>URL</th>
              <th>VERDICT</th>
              <th>MATCHES</th>
              <th>EXIT</th>
              <th>MS</th>
            </tr>
          </thead>
          <tbody id="history-body"></tbody>
        </table>
      </div>
      <div id="history-empty" class="muted center hidden">No history yet.</div>
    </div>
  </section>

  <script src="/static/app.js"></script>
</body>
</html>
